# ============================================================
# Configuration Nginx — reverse proxy vers backend Node:4000
# Installation :
#   sudo cp deploy/nginx-gmao.conf /etc/nginx/sites-available/gmao
#   sudo ln -sf /etc/nginx/sites-available/gmao /etc/nginx/sites-enabled/gmao
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d gmao.argos-oi.fr
# ============================================================

upstream gmao_backend {
    server 127.0.0.1:4000;
    keepalive 16;
}

# Redirection HTTP → HTTPS (certbot ajoutera le bloc 443 SSL)
server {
    listen 80;
    listen [::]:80;
    server_name gmao.argos-oi.fr;

    # Pour la validation Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Tout le reste → HTTPS (sera ajouté par certbot)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gmao.argos-oi.fr;

    # SSL — sera complété par certbot
    # ssl_certificate     /etc/letsencrypt/live/gmao.argos-oi.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/gmao.argos-oi.fr/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # En-têtes sécurité
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP : adapter selon les CDN utilisés (Leaflet/OSM, Chart.js, jsPDF, html2canvas)
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://unpkg.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; connect-src 'self' https://*.tile.openstreetmap.org; font-src 'self' data:;" always;

    # Limites pour upload photos
    client_max_body_size 12M;
    client_body_timeout 120s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # Logs
    access_log /var/log/nginx/gmao-access.log;
    error_log  /var/log/nginx/gmao-error.log;

    # Reverse proxy vers le backend Node
    location / {
        proxy_pass         http://gmao_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_buffering    off;
    }
}
